title: LSASS Memory Access by Non-System Process
id: 8f2c1d94-6b3e-4a17-9c85-2e4f7a1b0d33
status: experimental
description: >
  Detects a process opening a handle to lsass.exe with read/query rights typically
  requested by credential-dumping tooling (Mimikatz, procdump, comsvcs.dll MiniDump).
  Sysmon Event ID 10 (ProcessAccess) fires whenever one process opens another; LSASS
  holds cleartext credentials, hashes and Kerberos tickets in memory, so any non-system
  process reading it is high-signal.
author: Chayan Panchal
date: 2026/08/14
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://academy.hackthebox.com/module/details/222
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'   # PROCESS_VM_READ | PROCESS_QUERY_LIMITED_INFORMATION - classic minidump
      - '0x1410'   # adds PROCESS_QUERY_INFORMATION
      - '0x1438'
      - '0x143a'
      - '0x1f0fff' # PROCESS_ALL_ACCESS
  filter_system:
    SourceImage|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'
    SourceImage|endswith:
      - '\wininit.exe'
      - '\csrss.exe'
      - '\services.exe'
      - '\svchost.exe'
      - '\lsm.exe'
      - '\MsMpEng.exe'      # Defender
  condition: selection and not filter_system
falsepositives:
  - Endpoint protection and EDR agents legitimately inspect LSASS. Baseline your
    security stack's binaries and add them to filter_system rather than widening
    the GrantedAccess list.
  - Some backup and performance-monitoring agents query LSASS metadata.
level: high
tags:
  - attack.credential_access
  - attack.t1003.001
