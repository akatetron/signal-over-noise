title: Command Shell Spawned by Non-Interactive System Utility
id: 3a7d5e21-9f48-4c62-b1a0-7d93e5c48f10
status: experimental
description: >
  Detects a command interpreter (cmd.exe / powershell.exe) created by a parent process
  that has no legitimate reason to spawn an interactive shell. This is the observable
  side-effect of PPID spoofing, where an attacker sets a trusted process as the parent
  of their payload to blend into normal activity. Detection relies on the fact that the
  spoofed parent/child pairing is itself anomalous even when the parent is trusted.
author: Chayan Panchal
date: 2026/08/14
references:
  - https://attack.mitre.org/techniques/T1134/004/
  - https://attack.mitre.org/techniques/T1059/003/
logsource:
  product: windows
  category: process_creation
detection:
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_parent:
    ParentImage|endswith:
      - '\WerFault.exe'        # Windows Error Reporting
      - '\wermgr.exe'
      - '\SearchIndexer.exe'
      - '\spoolsv.exe'         # print spooler
      - '\sihost.exe'
      - '\fontdrvhost.exe'
      - '\dwm.exe'             # desktop window manager
      - '\LogonUI.exe'
      - '\consent.exe'
  condition: selection_child and selection_parent
fields:
  - ParentImage
  - ParentCommandLine
  - Image
  - CommandLine
  - User
  - CurrentDirectory
falsepositives:
  - Rare. WerFault may legitimately invoke a debugger if a postmortem debugger is
    configured via AeDebug. Verify the registry setting before dismissing.
  - Some legacy print drivers shell out from spoolsv. Baseline per environment.
level: high
tags:
  - attack.defense_evasion
  - attack.t1134.004
  - attack.execution
  - attack.t1059.003
